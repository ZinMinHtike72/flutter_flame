name: game_test
description: "Flutter and Flame game starter."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.11.0

workspace:
    - packages/app_network
    - packages/app_ui_kit
    - packages/yumyum_kitchen

dependencies:
    app_network:
        path: packages/app_network
    app_ui_kit:
        path: packages/app_ui_kit
    bloc: ^9.2.1
    cached_network_image: ^3.4.1
    cupertino_icons: ^1.0.8
    dio: ^5.11.1
    envied: ^1.3.10
    equatable: ^3.0.0
    flutter:
        sdk: flutter
    flutter_bloc: ^9.1.1
    flutter_localizations:
        sdk: flutter
    flutter_secure_storage: ^10.3.4
    get_it: ^9.3.0
    go_router: ^17.5.0
    intl: any
    json_annotation: ^4.12.0
    package_info_plus: ^8.3.1
    talker: ^5.1.20
    talker_dio_logger: ^5.1.20
    url_launcher: ^6.3.2
    uuid: ^4.5.1
    yumyum_kitchen:
        path: packages/yumyum_kitchen

dev_dependencies:
    bloc_test: ^10.0.0
    build_runner: ^2.15.1
    commitlint_cli: ^0.8.1
    envied_generator: ^1.3.10
    flame: 1.35.1
    flutter_gen_runner: ^5.15.0
    flutter_lints: ^6.0.0
    flutter_test:
        sdk: flutter
    husky: ^0.1.7
    integration_test:
        sdk: flutter
    json_serializable: ^6.14.1
    mocktail: ^1.0.5
    shared_preferences: ^2.5.3

flutter_gen:
    output: lib/gen/
    line_length: 80

flutter:
    generate: true
    uses-material-design: true
    assets:
        - assets/images/
    fonts:
        - family: NotoSansMyanmar
          fonts:
              - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar.ttf
        - family: Poppins
          fonts:
              - asset: assets/fonts/poppins/Poppins-Thin.ttf
                weight: 100
              - asset: assets/fonts/poppins/Poppins-ThinItalic.ttf
                weight: 100
                style: italic
              - asset: assets/fonts/poppins/Poppins-ExtraLight.ttf
                weight: 200
              - asset: assets/fonts/poppins/Poppins-ExtraLightItalic.ttf
                weight: 200
                style: italic
              - asset: assets/fonts/poppins/Poppins-Light.ttf
                weight: 300
              - asset: assets/fonts/poppins/Poppins-LightItalic.ttf
                weight: 300
                style: italic
              - asset: assets/fonts/poppins/Poppins-Regular.ttf
                weight: 400
              - asset: assets/fonts/poppins/Poppins-Italic.ttf
                weight: 400
                style: italic
              - asset: assets/fonts/poppins/Poppins-Medium.ttf
                weight: 500
              - asset: assets/fonts/poppins/Poppins-MediumItalic.ttf
                weight: 500
                style: italic
              - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/poppins/Poppins-SemiBoldItalic.ttf
                weight: 600
                style: italic
              - asset: assets/fonts/poppins/Poppins-Bold.ttf
                weight: 700
              - asset: assets/fonts/poppins/Poppins-BoldItalic.ttf
                weight: 700
                style: italic
              - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
                weight: 800
              - asset: assets/fonts/poppins/Poppins-ExtraBoldItalic.ttf
                weight: 800
                style: italic
              - asset: assets/fonts/poppins/Poppins-Black.ttf
                weight: 900
              - asset: assets/fonts/poppins/Poppins-BlackItalic.ttf
                weight: 900
                style: italic
