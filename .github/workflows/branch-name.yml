name: Branch name

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches-ignore: [main, development, production]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch name
        run: sh scripts/check_branch_name.sh "${BRANCH}"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
