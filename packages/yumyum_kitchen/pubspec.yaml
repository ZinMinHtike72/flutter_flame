name: yumyum_kitchen
description: "A bilingual, offline Yangon night-market cooking game."
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.4"

dependencies:
  app_ui_kit:
    path: ../app_ui_kit
  audioplayers: ^6.5.1
  equatable: ">=2.0.7 <4.0.0"
  flame: 1.35.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  image: ^4.13.1

flutter:
  generate: true
  assets:
    - assets/images/
    - assets/images/customers/
    - assets/images/restaurant/
    - assets/audio/

